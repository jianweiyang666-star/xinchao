<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心潮预览入口</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #5f5362;
        --muted: #8b7e8c;
        --line: rgba(255, 255, 255, 0.58);
        --glass: rgba(255, 255, 255, 0.35);
        --shadow: rgba(111, 82, 102, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 52% 16%, rgba(255, 255, 255, 0.82) 0 2.2rem, transparent 5.8rem),
          linear-gradient(180deg, #d8cce6 0%, #efd8d1 54%, #fff0c9 100%);
      }

      main {
        width: min(520px, 100%);
        padding: 34px 30px 30px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--glass);
        box-shadow: 0 28px 80px var(--shadow);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: 0;
      }

      p {
        margin: 12px 0 24px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.8;
      }

      .links {
        display: grid;
        gap: 12px;
      }

      a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 58px;
        padding: 0 18px 0 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.34);
        text-decoration: none;
        box-shadow: 0 12px 30px rgba(111, 82, 102, 0.08);
        transition:
          transform 160ms ease,
          background 160ms ease,
          box-shadow 160ms ease;
      }

      a:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.52);
        box-shadow: 0 16px 34px rgba(111, 82, 102, 0.12);
      }

      .title {
        font-size: 15px;
        font-weight: 500;
      }

      .url {
        margin-top: 2px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        overflow-wrap: anywhere;
      }

      .arrow {
        flex: 0 0 auto;
        font-size: 18px;
        color: #897189;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>心潮预览入口</h1>
      <p>双击这个文件后，可以从这里快速打开云端或本地预览。若云端打不开，先检查 PM2 里的 xinchao-web 是否在线并监听 3002。</p>

      <div class="links">
        <a href="http://47.118.80.247:3002/" target="_blank" rel="noreferrer">
          <span>
            <span class="title">打开云端网站</span>
            <span class="url">http://47.118.80.247:3002/</span>
          </span>
          <span class="arrow">→</span>
        </a>

        <a href="http://localhost:3002/" target="_blank" rel="noreferrer">
          <span>
            <span class="title">打开本地前端 3002</span>
            <span class="url">http://localhost:3002/</span>
          </span>
          <span class="arrow">→</span>
        </a>

        <a href="http://localhost:3000/" target="_blank" rel="noreferrer">
          <span>
            <span class="title">打开本地前端 3000</span>
            <span class="url">http://localhost:3000/</span>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
    </main>
  </body>
</html>
